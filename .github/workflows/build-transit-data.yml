name: Build official Sitilink transit data

on:
  push:
    paths:
      - "build_transit_data.py"
      - ".github/workflows/build-transit-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Download official Sitilink stop and route coordinates
        run: python build_transit_data.py

      - name: Publish generated dataset to both frontends
        run: |
          mkdir -p flask/app/static/assets
          cp transit_data.json flask/app/static/transit_data.json
          cp transit_data.json flask/app/static/assets/transit_data.json

      - name: Validate generated dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("transit_data.json").read_text())
          stops = data.get("stops", {})
          routes = data.get("routes", {})

          assert len(stops) >= 1000, f"Unexpectedly small stop list: {len(stops)}"
          assert len(routes) >= 100, f"Unexpectedly small route list: {len(routes)}"

          bad = []
          for sid, stop in stops.items():
              lat, lng = stop.get("lat"), stop.get("lng")
              if lat is not None and not (20.95 <= lat <= 21.40 and 72.60 <= lng <= 73.05):
                  bad.append((sid, lat, lng))

          assert not bad, f"Invalid master coordinates: {bad[:5]}"
          print(f"Validated {len(stops)} master stops and {len(routes)} routes")
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transit_data.json flask/app/static/transit_data.json flask/app/static/assets/transit_data.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
            exit 0
          fi
          git commit -m "Build official Sitilink transit dataset"
          git push
